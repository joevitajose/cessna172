<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cessna 172R Test | AboveFL360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f6f1e7;--panel:#fffdf8;--line:#d8d0be;--text:#1b1d21;--mute:#666a72;--accent:#ee4f25;--ok:#178a4a;--bad:#d03636;--okbg:rgba(23,138,74,.12);--badbg:rgba(208,54,54,.1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Archivo',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 18px;border-bottom:1px solid var(--line);margin-bottom:22px}
header.top img{height:34px;display:block}
.hidden{display:none!important}
h1{font-size:clamp(28px,6vw,46px);line-height:1.05;margin:8px 0 12px;font-weight:800;letter-spacing:-.02em}
h1 span{color:var(--accent)}
p.lead{color:var(--mute);margin:0 0 24px;max-width:56ch}
.card{background:var(--panel);border:1px solid var(--line);padding:22px}
label{display:block;font-weight:600;margin-bottom:8px}
input[type=text]{width:100%;padding:14px;font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:0}
input[type=text]:focus,button:focus-visible,.opt:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:600;padding:13px 22px;border:1px solid var(--text);background:var(--text);color:#fff;cursor:pointer;border-radius:0}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.facts{display:flex;gap:28px;flex-wrap:wrap;margin:0 0 22px;color:var(--mute)}
.facts b{display:block;color:var(--text);font-size:26px;font-weight:800}
.err{color:var(--bad);margin:10px 0 0;min-height:1.4em}
/* test */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.timer{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.who{color:var(--mute);font-size:14px}
.qhead{color:var(--mute);margin:22px 0 6px;font-size:14px}
.qtext{font-size:clamp(19px,3.5vw,24px);font-weight:600;margin:0 0 18px;line-height:1.35}
.opt{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1px solid var(--line);background:var(--panel);margin-bottom:10px;cursor:pointer}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:rgba(238,79,37,.1)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:26px}
.grid button{font:inherit;font-size:13px;padding:8px 0;background:var(--panel);color:var(--mute);border:1px solid var(--line);cursor:pointer;border-radius:0}
.grid button.done{background:#e6dfcd;color:var(--text);border-color:#b9b09b}
.grid button.cur{border-color:var(--accent);color:var(--text);background:rgba(238,79,37,.22)}
@media(max-width:520px){.grid{grid-template-columns:repeat(5,1fr)}}
/* result */
.score{font-size:clamp(44px,12vw,84px);font-weight:800;line-height:1;margin:6px 0}
.score small{font-size:.4em;color:var(--mute)}
.status{padding:10px 14px;margin:14px 0;border:1px solid var(--line);color:var(--mute);font-size:14px}
.status.ok{border-color:var(--ok);color:var(--ok)}.status.fail{border-color:var(--bad);color:var(--bad)}
.rq{border:1px solid var(--line);background:var(--panel);padding:16px;margin-bottom:14px}
.rq h3{margin:0 0 10px;font-size:17px;font-weight:600}
.rq .meta{color:var(--mute);font-size:12px;margin-bottom:6px}
.ro{padding:8px 10px;border:1px solid transparent;margin-top:4px}
.ro.right{background:var(--okbg);border-color:var(--ok)}
.ro.wrong{background:var(--badbg);border-color:var(--bad)}
.tag{font-size:12px;font-weight:600;margin-left:6px}
.ro.right .tag{color:var(--ok)}.ro.wrong .tag{color:var(--bad)}
.skip{color:var(--mute);font-size:13px;margin-top:8px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 26px}
</style>
</head>

const $ = id => document.getElementById(id);
let paper=[], answers={}, cur=0, name='', startedAt=0, endAt=0, tick=null, submitted=false, payload=null;

function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const b=new Uint32Array(1);crypto.getRandomValues(b);const j=b[0]%(i+1);[r[i],r[j]]=[r[j],r[i]];}return r;}
function show(id){['start','test','result'].forEach(s=>$(s).classList.toggle('hidden',s!==id));window.scrollTo(0,0);}
function el(t,c,txt){const e=document.createElement(t);if(c)e.className=c;if(txt!==undefined)e.textContent=txt;return e;}

$('startBtn').onclick=()=>{
  name=$('name').value.trim().replace(/\s+/g,' ');
  if(name.length<2){$('nameErr').textContent='Please enter your name to start.';return;}
  paper=shuffle(BANK).slice(0,TOTAL_Q);
  answers={};cur=0;submitted=false;startedAt=Date.now();endAt=startedAt+DURATION_MS;
  $('topWho').textContent=name;$('barWho').textContent=name;
  buildGrid();render();show('test');
  tick=setInterval(updateTimer,250);updateTimer();
  window.onbeforeunload=e=>{if(!submitted){e.preventDefault();e.returnValue='';}};
};
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')$('startBtn').click();});

function updateTimer(){
  const left=Math.max(0,endAt-Date.now());
  const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
  $('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  $('timer').classList.toggle('low',left<=5*60000);
  if(left<=0&&!submitted){finish(true);}
}
function buildGrid(){
  const g=$('grid');g.innerHTML='';
  paper.forEach((q,i)=>{const b=el('button','',i+1);b.onclick=()=>{cur=i;render();};g.appendChild(b);});
}
function render(){
  const q=paper[cur];
  $('qhead').textContent='Question '+(cur+1)+' of '+paper.length;
  $('qtext').textContent=q.q;
  const o=$('opts');o.innerHTML='';
  Object.keys(q.o).forEach(k=>{
    const l=el('label','opt'+(answers[cur]===k?' sel':''));
    const r=document.createElement('input');r.type='radio';r.name='opt';r.checked=answers[cur]===k;
    r.onchange=()=>{answers[cur]=k;render();};
    l.appendChild(r);l.appendChild(el('span','',k+') '+q.o[k]));o.appendChild(l);
  });
  $('prev').disabled=cur===0;$('next').disabled=cur===paper.length-1;
  [...$('grid').children].forEach((b,i)=>{b.className=(i===cur?'cur ':'')+(answers[i]?'done':'');});
  $('answered').textContent=Object.keys(answers).length+' of '+paper.length+' answered';
}
$('prev').onclick=()=>{if(cur>0){cur--;render();}};
$('next').onclick=()=>{if(cur<paper.length-1){cur++;render();}};
$('submitBtn').onclick=()=>{
  const un=paper.length-Object.keys(answers).length;
  const msg=un?('You have '+un+' unanswered question'+(un>1?'s':'')+'. Submit anyway?'):'Submit your test now?';
  if(confirm(msg))finish(false);
};

function finish(auto){
  if(submitted)return;submitted=true;clearInterval(tick);window.onbeforeunload=null;
  const now=Date.now();
  const detail=paper.map((q,i)=>({
    no:i+1,original_no:q.n,question:q.q,options:q.o,
    selected:answers[i]||null,correct:q.a,is_correct:answers[i]===q.a
  }));
  const score=detail.filter(d=>d.is_correct).length;
  payload={candidate_name:name,started_at:new Date(startedAt).toISOString(),submitted_at:new Date(now).toISOString(),
    time_taken_seconds:Math.min(Math.round((now-startedAt)/1000),DURATION_MS/1000),score:score,total_questions:paper.length,
    auto_submitted:!!auto,answers:detail};
  showResult(auto);save();
}

function showResult(auto){
  $('resWho').textContent=payload.candidate_name+(auto?' (time up, submitted automatically)':'');
  const sc=$('score');sc.textContent='';sc.append(payload.score,' ');const sm=el('small','','/ '+payload.total_questions);sc.appendChild(sm);
  const t=payload.time_taken_seconds;$('resMeta').textContent='Time taken: '+Math.floor(t/60)+' min '+(t%60)+' sec';
  const rv=$('review');rv.innerHTML='';
  payload.answers.forEach(d=>{
    const box=el('div','rq');
    box.appendChild(el('div','meta','Question '+d.no+' (bank no. '+d.original_no+')'));
    box.appendChild(el('h3','',d.question));
    Object.keys(d.options).forEach(k=>{
      let c='ro',tag='';
      if(k===d.correct){c+=' right';tag=d.selected===k?'Your answer, correct':'Correct answer';}
      else if(k===d.selected){c+=' wrong';tag='Your answer, wrong';}
      const r=el('div',c,k+') '+d.options[k]);if(tag)r.appendChild(el('span','tag',tag));box.appendChild(r);
    });
    if(!d.selected)box.appendChild(el('div','skip','Not answered. Correct answer: '+d.correct));
    rv.appendChild(box);
  });
  show('result');
}

async function save(){
  const st=$('saveStatus');st.className='status';st.textContent='Saving your result...';
  $('retrySave').classList.add('hidden');
  if(SUPABASE_URL.startsWith('PASTE')||SUPABASE_KEY.startsWith('PASTE')){
    st.className='status fail';st.textContent='Result not saved: Supabase URL and key are not set in the page.';return;}
  try{
    const r=await fetch(SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/'+TABLE,{method:'POST',
      headers:Object.assign({'apikey':SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},SUPABASE_KEY.startsWith('eyJ')?{'Authorization':'Bearer '+SUPABASE_KEY}:{}),
      body:JSON.stringify(payload)});
    if(!r.ok)throw new Error(r.status+' '+(await r.text()));
    st.className='status ok';st.textContent='Your result has been saved.';
  }catch(e){
    st.className='status fail';st.textContent='Could not save result: '+e.message;$('retrySave').classList.remove('hidden');
  }
}
$('retrySave').onclick=save;

/* PDF */
const pdfTxt=s=>String(s).replace(/\u2070/g,'\u00B0').replace(/[^\x00-\xFF\u2013\u2014\u2018\u2019\u201C\u201D\u2022]/g,'?');
$('pdfBtn').onclick=()=>{
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210,M=14,TW=W-2*M;let y=0;
  const logo=document.querySelector('header.top img').src;
  function header(){doc.addImage(logo,'PNG',M,7,45,45*45/370);}
  header();y=30;
  doc.setTextColor(0);doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text('Cessna 172R Test Result',M,y);y+=7;
  doc.setFont('helvetica','normal');doc.setFontSize(10);
  doc.text(pdfTxt('Name: '+payload.candidate_name),M,y);y+=5;
  doc.text('Score: '+payload.score+' / '+payload.total_questions,M,y);y+=5;
  doc.text('Submitted: '+new Date(payload.submitted_at).toLocaleString(),M,y);y+=5;
  doc.text('Time taken: '+Math.floor(payload.time_taken_seconds/60)+' min '+(payload.time_taken_seconds%60)+' sec',M,y);y+=9;
  payload.answers.forEach(d=>{
    const ql=doc.splitTextToSize(pdfTxt(d.no+') '+d.question),TW);
    const ols=Object.keys(d.options).map(k=>{
      let tag='';if(k===d.correct)tag=d.selected===k?'  [Your answer - correct]':'  [Correct answer]';else if(k===d.selected)tag='  [Your answer - wrong]';
      return {k,lines:doc.splitTextToSize(pdfTxt(k+') '+d.options[k]+tag),TW-8)};
    });
    let h=ql.length*5+2+ols.reduce((a,o)=>a+o.lines.length*4.6,0)+(d.selected?0:5)+5;
    if(y+h>285){doc.addPage();y=16;}
    doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setTextColor(0);doc.text(ql,M,y);y+=ql.length*5+2;
    doc.setFont('helvetica','normal');doc.setFontSize(10);
    ols.forEach(o=>{
      if(o.k===d.correct){doc.setTextColor(20,140,70);doc.setFont('helvetica','bold');}
      else if(o.k===d.selected){doc.setTextColor(200,40,40);doc.setFont('helvetica','bold');}
      else{doc.setTextColor(40);doc.setFont('helvetica','normal');}
      doc.text(o.lines,M+6,y);y+=o.lines.length*4.6;
    });
    if(!d.selected){doc.setTextColor(110);doc.setFont('helvetica','italic');doc.text('Not answered. Correct answer: '+d.correct,M+6,y+1);y+=5;}
    y+=5;
  });
  doc.save('AboveFL360_Cessna172R_'+payload.candidate_name.replace(/[^A-Za-z0-9]+/g,'_')+'.pdf');
};
